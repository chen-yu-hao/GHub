name: Build taskboard APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taskboard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Check packaged board interactions and design
        run: node scripts/taskboard/board.test.cjs
      - name: Test, lint and build the independently installable APK
        run: ./gradlew -PpreviewApplicationId=dev.remotegpt.taskboard :codex-client:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: ghub-taskboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskboard-verification-reports
          path: |
            codex-client/build/reports/tests/
            app/build/reports/
